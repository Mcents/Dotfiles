# include ./theme.conf  # disabled — omarchy theme switcher manages colors
listen_on unix:/tmp/kitty
allow_remote_control yes
font-family JetBrains Mono Nerd Font
font_size 12.0
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map cmd+t new_tab_with_cwd !neighbor
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+2 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map ctrl+] next_tab
map ctrl+[ previous_tab
#macos_titlebar_color background
hide_window_decorations titlebar-and-corners
background_opacity 0.80
background_blur 32
# url_color #83a598
# cursor #ebdbb2

# Tabs
tab_bar_edge top
tab_bar_align left
tab_bar_style custom
tab_activity_symbol none
bell_on_tab no
tab_separator ""
tab_bar_margin_width 0.0
tab_bar_margin_height 5.0 2.0
tab_title_template "{f'{title[:30]}…' if title.rindex(title[-1]) + 1 > 30 else (title.center(6) if (title.rindex(title[-1]) + 1) % 2 == 0 else title.center(5))}"
active_tab_font_style bold

include themes/omarchy-waffle-cat.conf
