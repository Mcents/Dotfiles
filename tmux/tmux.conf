# Keep Ctrl+B as prefix (default)

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse support
set -g mouse on

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Increase scrollback buffer
set -g history-limit 50000

# Reduce escape delay (important for Neovim)
set -sg escape-time 10

# Focus events (needed for Neovim autoread)
set -g focus-events on

# Vim-style pane navigation with prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style splits
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# New windows keep current path
bind c new-window -c "#{pane_current_path}"

# Dev layout: two small horizontal panes side by side at the bottom
bind D split-window -v -l 30% -c "#{pane_current_path}" \; split-window -h -c "#{pane_current_path}"

# Kill all panes except the current one
bind Q kill-pane -a

# Seamless Ctrl+hjkl navigation between Neovim and tmux (vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Status bar position
set -g status-position top
set -g status 2

# Thin accent line under the status bar
set -g status-format[1] "#[fg=#{@minimal-tmux-bg},bg=default]#(printf '%%*s' #{client_width} '' | tr ' ' '▔')"

# minimal-tmux-status config
set -g @minimal-tmux-bg "#78824b"
set -g @minimal-tmux-fg "#222222"
set -g @minimal-tmux-indicator true
set -g @minimal-tmux-status "top"

# Pane borders — follow terminal theme
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"

# TPM — auto-install on first run
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'niksingh710/minimal-tmux-status'

run '~/.tmux/plugins/tpm/tpm'
